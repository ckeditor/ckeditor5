<div class="toolbar" id="mode">
	<strong>Attach the editor to:</strong>
	<button data-mode="iframe">An iframe</button>
	<button data-mode="window">A new window (window.open)</button>
</div>

<div class="toolbar" id="commands"></div>

<div class="status">
	<div><strong>View focused:</strong> <span id="status-focused">-</span></div>
	<div><strong>Model selection:</strong> <span id="status-selection">-</span></div>
	<div><strong>Selected cells:</strong> <span id="status-cells">-</span></div>
</div>

<iframe id="editor-iframe" title="Editor iframe"></iframe>

<div class="toolbar">
	<button id="get-data">Log editor data</button>
	<button id="clear-log">Clear log</button>
</div>

<pre id="log"></pre>

<style>
	#editor-iframe {
		display: block;
		width: 100%;
		height: 500px;
		margin: 1em 0;
		border: 2px dashed hsl( 210, 75%, 60% );
	}

	#editor-iframe[hidden] {
		display: none;
	}

	.toolbar {
		display: flex;
		flex-wrap: wrap;
		gap: 4px;
		margin: 1em 0;
	}

	.toolbar button[disabled] {
		opacity: .5;
	}

	.status {
		font-family: monospace;
	}

	#log {
		max-height: 300px;
		overflow: auto;
		padding: 1em;
		background: hsl( 0, 0%, 95% );
		white-space: pre-wrap;
	}
</style>
