packages:
  - packages/*

allowBuilds:
  '@ckeditor/ckeditor5-dev-tests': true
  '@ckeditor/ckeditor5-mermaid@https://codeload.github.com/ckeditor/ckeditor5-mermaid/tar.gz/a6d020ca6941e35e2a3110e54896d2f4096383c1': true
  '@parcel/watcher': true
  '@swc/core': true
  'core-js': true
  'esbuild': true
  'hexo-util': true
  'puppeteer': true
  'sharp': true
  'snyk': true

# This section must be synchronized with `ckeditor/ckeditor5-commercial`.
overrides:
  '@puppeteer/browsers@^2': '^3.0.6'
  'body-parser@^1': '^1.20.9'
  'diff@^7': '^8.0.3'
  'glob@^13': '^14.0.3'
  'http-proxy-agent@^5': '^6.1.1'
  'lodash@^4': '^4.18.1'
  'minimatch@^9': '^9.0.7'
  'path-to-regexp@^0': '^0.1.13'
  'qs@^6': '^6.16.1'
  'serialize-javascript@^6': '^7.1.3'
  'uuid@^8': '^14.0.0'
  'ws@^8': '^8.20.1'
  'yauzl@^2': '^3.2.1'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'
  - 'umberto'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false
