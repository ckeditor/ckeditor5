packages:
  - packages/*

allowBuilds:
  '@ckeditor/ckeditor5-mermaid@https://codeload.github.com/ckeditor/ckeditor5-mermaid/tar.gz/68116cca61fcc93c0026bd5499c9fd5e39391e03': true
  '@parcel/watcher': true
  '@swc/core': true
  'core-js': true
  'esbuild': true
  'hexo-util': true
  'puppeteer': true
  'sharp': true
  'snyk': true

# This section must be synchronized with `ckeditor/ckeditor5-commercial`.
overrides:
  '@puppeteer/browsers@^2': '^3.0.6'
  'http-proxy-agent@^5': '^6.1.1'
  'katex@^0.16': '^0.18.10'
  'markdown-it@^14': '^14.3.1'
  'postcss@^8': '^8.5.23'
  'uuid@^8': '^14.0.0'
  'yauzl@^2': '^3.2.1'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  # Company-owned scopes.
  - '@ckeditor/*'
  - '@cksource/*'
  # Company-owned unscoped names, listed one by one.
  - 'ckeditor5'
  - 'ckeditor5-premium-features'
  - 'ckeditor5-collaboration'
  - 'eslint-config-ckeditor5'
  - 'eslint-plugin-ckeditor5-rules'
  - 'umberto'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
autoDedupe: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false
# Only registry tarballs may enter the tree as subdependencies. Direct git/tarball
# dependencies stay allowed - see ckeditor/ckeditor5#20216.
blockExoticSubdeps: true

catalog:
  '@vitest/browser-playwright': '^5.0.0'
  '@vitest/coverage-v8': '^5.0.0'
  'vitest': '^5.0.0'
