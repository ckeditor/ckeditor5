packages:
  - packages/*

allowBuilds:
  '@ckeditor/ckeditor5-mermaid@https://codeload.github.com/ckeditor/ckeditor5-mermaid/tar.gz/68116cca61fcc93c0026bd5499c9fd5e39391e03': true
  '@parcel/watcher': true
  '@swc/core': true
  'core-js': true
  'esbuild': true
  'hexo-util': true
  'puppeteer': true
  'sharp': true
  'snyk': true

# This section must be synchronized with `ckeditor/ckeditor5-commercial`.
overrides:
  '@iktakahiro/markdown-it-katex>katex': ^0.16.0
  'body-parser@^1': '^1.20.6'
  'brace-expansion@^1': '^1.1.18'
  'brace-expansion@^2': '^2.1.4'
  'brace-expansion@^5': '^5.0.9'
  'dompurify@^3': '^3.4.12'
  'fast-uri@^3': '^3.1.5'
  'http-proxy-agent@^5': '^6.1.1'
  'ip-address@^10': '^10.3.1'
  'js-yaml@^4': '^4.3.0'
  'markdown-it-toc': 'npm:@maboloshi/markdown-it-toc@1.1.1'
  'postcss@^8': '^8.5.23'
  'socket.io-parser@^4': '^4.2.7'
  'svgo@^3': '^3.3.4'
  'tar@^7': '^7.5.21'
  'undici@^6': '^6.28.0'
  'uuid@^8': '^14.0.0'
  'yauzl@^2': '^3.2.1'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'
  - 'umberto'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false

catalog:
  '@vitest/browser-playwright': '^4.1.10'
  '@vitest/coverage-v8': '^4.1.10'
  'vitest': '^4.1.10'
